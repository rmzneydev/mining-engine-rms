name: CI

on:
  push:
    branches: [main, dev, "feature/**"]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  auth-service:
    name: Auth service (Vitest + Supertest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auth-service
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: mining_user
          POSTGRES_PASSWORD: mining_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mining_user -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: auth-service/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  business-service:
    name: Business service (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: business-service
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: mining_user
          POSTGRES_PASSWORD: mining_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mining_user -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: business-service/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m pytest

  frontend:
    name: Frontend (lint, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker-images:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [auth-service, business-service, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose build
