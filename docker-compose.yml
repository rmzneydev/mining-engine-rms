services:
  postgres:
    image: postgres:16-alpine
    container_name: mining-engine-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-mining_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      AUTH_DB_NAME: ${AUTH_DB_NAME:-auth_db}
      AUTH_DB_USER: ${AUTH_DB_USER:-auth_user}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?AUTH_DB_PASSWORD is required}
      BUSINESS_DB_NAME: ${BUSINESS_DB_NAME:-business_db}
      BUSINESS_DB_USER: ${BUSINESS_DB_USER:-business_user}
      BUSINESS_DB_PASSWORD: ${BUSINESS_DB_PASSWORD:?BUSINESS_DB_PASSWORD is required}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  auth-service:
    build:
      context: ./auth-service
    container_name: mining-engine-auth
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3001
      DATABASE_URL: "postgresql://${AUTH_DB_USER:-auth_user}:${AUTH_DB_PASSWORD:?AUTH_DB_PASSWORD is required}@postgres:5432/${AUTH_DB_NAME:-auth_db}"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN: 1h
      ADMIN_NAME: ${ADMIN_NAME:-Administrador}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@test.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  business-service:
    build:
      context: ./business-service
    container_name: mining-engine-business
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql+psycopg://${BUSINESS_DB_USER:-business_user}:${BUSINESS_DB_PASSWORD:?BUSINESS_DB_PASSWORD is required}@postgres:5432/${BUSINESS_DB_NAME:-business_db}"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ISSUER: auth-service
      JWT_AUDIENCE: business-service
    ports:
      - "8002:8002"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_AUTH_API_URL: ${VITE_AUTH_API_URL:-http://localhost:3001}
        VITE_BUSINESS_API_URL: ${VITE_BUSINESS_API_URL:-http://localhost:8002}
    container_name: mining-engine-frontend
    restart: unless-stopped
    depends_on:
      auth-service:
        condition: service_healthy
      business-service:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  postgres_data:
